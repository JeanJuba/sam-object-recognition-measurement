# =====================================================================
# Configuração para o vídeo aruco_longo.mp4 (1080x1920 vertical, 60s):
# marcador ArUco impresso em papel no topo à esquerda como referência
# estática; objetos brancos (borrachas/cápsulas) sobre tecido preto na
# metade de baixo do quadro. Uso:
#   python main.py --config config_aruco_longo.yaml run
# =====================================================================

video:
  input_path: data/videos/aruco_longo.mp4  # vídeo a ser processado
  frame_stride: 3                     # processa 1 a cada N frames (desempenho)
  output_dir: data/output             # onde salvar vídeo anotado e CSVs

preprocessing:
  filter: gaussian        # gaussian | mean | none
  kernel_size: 3          # ímpar (3, 5, 7...); kernel maior borra objetos pequenos

calibration:
  # Referência: marcador ArUco decodificado de verdade (cv2.aruco) — cantos
  # com precisão subpixel, sem ROI nem limiarização
  reference:
    type: aruco
    dictionary: DICT_6X6_50    # dicionário do marcador impresso
    marker_id: 42              # id decodificado; evita confundir com outro marcador
    known_length_mm: [98.5, 96.5] # [horizontal, vertical] NA IMAGEM, medidos com
                               # régua (largura x altura; impressão fora de
                               # esquadro); a escala é a média das duas direções
  scale_correction: 0.80       # correção de plano IDENTIFICADA COM O PAQUÍMETRO
                               # (2026-08-29): as peças medidas com escala do
                               # marcador saíam ~20% maiores que o real, de forma
                               # consistente em todas — o papel do marcador está
                               # bem mais distante da câmera que o plano das
                               # borrachas. Fator = mediana(real/medido) x 0.96
                               # anterior. Engloba também eventual erro da
                               # dimensão impressa — conferir marcador com régua.
  n_frames: 15                 # frames usados na calibração (mediana)

segmentation:
  model: FastSAM-s.pt     # FastSAM-s.pt (rápido) | FastSAM-x.pt (preciso)
  device: auto            # auto | cuda | cpu
  imgsz: 1024
  conf: 0.3
  iou: 0.9
  prompt_mode: everything # everything | auto_points (prompts por detecção de contornos)
  min_area_px: 5000       # descarta máscaras pequenas (menor objeto ~6000 px)
  max_area_ratio: 0.15    # descarta máscaras grandes (papel; o marcador tem ~12%
                          # do frame mas é excluído pela zona da calibração)
  border_margin_px: 8     # descarta máscaras coladas na borda do frame
  max_aspect_ratio: 8     # descarta máscaras muito alongadas; 0 = desliga
  refine_top_face:        # borrachas com topo claro: remove a lateral sombreada
    enabled: true         # que aparece pela câmera angulada (contorno/área só do topo)
    min_contrast: 25      # diferença mínima de brilho topo vs. lateral para refinar
    min_keep_ratio: 0.3   # se sobrar menos que isso da máscara, mantém a original
    max_keep_ratio: 0.95  # se quase nada foi removido, mantém a original

tracking:
  max_distance_px: 150    # distância máx. de associação entre frames
  max_missed_frames: 12   # frames sem detecção antes de encerrar o track
  min_hits: 3             # detecções mínimas para o track ser considerado válido

classification:
  # Quatro tipos de borracha, dimensões nominais MEDIDAS COM PAQUÍMETRO
  # (2026-08-29): retangular 42x21, quadrada 32x23, ponteira 30x13 (13 na
  # parte mais larga) e oval 48x36. Tolerância de ±3 mm em cada dimensão.
  classes:
    - name: borracha_retangular
      length_mm: [39.0, 45.0]
      width_mm: [18.0, 24.0]
    - name: borracha_quadrada
      length_mm: [29.0, 35.0]
      width_mm: [20.0, 26.0]
    - name: borracha_ponteira
      length_mm: [27.0, 33.0]
      width_mm: [10.0, 16.0]
    - name: borracha_oval
      length_mm: [45.0, 51.0]
      width_mm: [33.0, 39.0]
