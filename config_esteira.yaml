# =====================================================================
# Configuração para o vídeo esteira.mp4 (464x832, 60 fps, 37 s):
# esteira cinza com peças passando uma a uma (moeda de referência,
# parafusos, porcas, arruela). Mesmo conteúdo do config.yaml padrão. Uso:
#   python main.py --config config_esteira.yaml run
# =====================================================================

video:
  input_path: data/videos/esteira.mp4 # vídeo a ser processado
  frame_stride: 2                     # processa 1 a cada N frames (desempenho)
  output_dir: data/output             # onde salvar vídeo anotado e CSVs

preprocessing:
  filter: gaussian        # gaussian | mean | none
  kernel_size: 3          # ímpar (3, 5, 7...); kernel maior borra objetos pequenos

calibration:
  # Objeto de referência com dimensão conhecida presente na cena
  reference:
    type: first_object        # a referência é o 1º objeto que passa na esteira (moeda)
    known_length_mm: 35.0     # maior dimensão real da referência (mm) — AJUSTE AQUI
    min_track_frames: 5       # nº mínimo de medições para aceitar o track como referência
    min_length_px: 40         # dimensão mínima em px (rejeita ruído/manchas da esteira)
    max_length_px: 150        # dimensão máxima em px (rejeita riscos/costuras da esteira)
    max_scan_frames: 900      # limite de frames da varredura de calibração
  n_frames: 15                # frames usados na calibração (mediana)

segmentation:
  model: FastSAM-s.pt     # FastSAM-s.pt (rápido) | FastSAM-x.pt (preciso)
  device: auto            # auto | cuda | cpu
  imgsz: 1024
  conf: 0.3               # conf alta perde peças pequenas (porcas/arruelas)
  iou: 0.9
  prompt_mode: everything # everything | auto_points (prompts por detecção de contornos)
  min_area_px: 450        # descarta máscaras muito pequenas (manchas da esteira)
  max_area_ratio: 0.35    # descarta máscaras > 35% do frame (fundo/bancada)
  border_margin_px: 5     # descarta máscaras coladas na borda do frame
  max_aspect_ratio: 8     # descarta máscaras muito alongadas (riscos da esteira); 0 = desliga
  refine_top_face:        # remove a lateral sombreada de objetos com altura (câmera angulada)
    enabled: true
    min_contrast: 25      # diferença mínima de brilho topo vs. lateral para refinar
    min_keep_ratio: 0.3   # se sobrar menos que isso da máscara, mantém a original
    max_keep_ratio: 0.95  # se quase nada foi removido, mantém a original

tracking:
  max_distance_px: 120    # distância máx. de associação entre frames
  max_missed_frames: 12   # frames sem detecção antes de encerrar o track
  min_hits: 3             # detecções mínimas para o track ser considerado válido

classification:
  # Classes de peças e tolerâncias industriais (mm).
  # O objeto é atribuído à classe de dimensões nominais mais próximas
  # e aprovado somente se estiver dentro das faixas [min, max].
  classes:
    # tolerâncias PROVISÓRIAS — meça os objetos reais (paquímetro/régua)
    # e ajuste os nominais e as faixas
    - name: parafuso
      length_mm: [35.0, 88.0]
      width_mm: [7.0, 25.0]
    - name: porca
      length_mm: [10.0, 22.0]
      width_mm: [8.5, 21.0]
    - name: arruela
      length_mm: [16.0, 28.0]
      width_mm: [14.0, 26.0]
